name: browser

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS build, installers, launch verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r Source/Browser/requirements.txt

      - name: Run tests
        working-directory: Source/Browser
        run: python -m pytest tests -q

      - name: Build engine, app, DMG and PKG
        working-directory: Source/Browser
        run: python tools/build.py

      - name: Verify the app opens
        working-directory: Source/Browser
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: python tools/build.py verify

      - name: Verify the DMG contents
        run: |
          hdiutil attach Source/Browser/dist/Sreon.dmg -mountpoint /tmp/sreon-dmg
          test -d /tmp/sreon-dmg/Sreon.app
          test -d /tmp/sreon-dmg/Applications
          test -x /tmp/sreon-dmg/Sreon.app/Contents/MacOS/Sreon
          echo "DMG contains Sreon.app and the Applications link"
          hdiutil detach /tmp/sreon-dmg

      - name: Verify the PKG installs Sreon into Applications
        working-directory: Source/Browser
        run: |
          sudo installer -pkg dist/Sreon-Installer.pkg -target /
          test -d /Applications/Sreon.app
          test -x /Applications/Sreon.app/Contents/MacOS/Sreon
          echo "PKG installed Sreon.app to /Applications"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Source/Browser/dist/Sreon.dmg
            Source/Browser/dist/Sreon-Installer.pkg

  windows:
    name: Windows build, installer, launch verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r Source/Browser/requirements.txt

      - name: Run tests
        working-directory: Source/Browser
        run: python -m pytest tests -q

      - name: Build engine and app
        working-directory: Source/Browser
        run: python tools/build.py

      - name: Verify the app opens
        working-directory: Source/Browser
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: python tools/build.py verify

      - name: Build the installer
        working-directory: Source/Browser
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          & $iscc "packaging\windows\sreon.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Source/Browser/dist/Sreon-Setup.exe

  linux:
    name: Linux build, packages, launch verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2 libxtst6 libxkbfile1 libgbm1 xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r Source/Browser/requirements.txt

      - name: Run tests
        working-directory: Source/Browser
        run: python -m pytest tests -q

      - name: Build engine, tarball and deb
        working-directory: Source/Browser
        run: python tools/build.py

      - name: Verify the app opens
        working-directory: Source/Browser
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a python tools/build.py verify

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Source/Browser/dist/Sreon-linux.tar.gz
            Source/Browser/dist/Sreon-linux.deb

  release:
    name: Attach installers to the release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: installers

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
